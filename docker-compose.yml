name: mmscrm

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: crm
      POSTGRES_PASSWORD: crm
      POSTGRES_DB: crm
    ports:
      # Bound to localhost only — the dev database is never reachable from the network.
      - '127.0.0.1:5432:5432'
    volumes:
      # Postgres 18+ images keep data under /var/lib/postgresql/<major>/, so mount the parent.
      - pgdata:/var/lib/postgresql
      # Runs once, on first start with an empty volume: creates the crm_test database.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U crm -d crm']
      interval: 5s
      timeout: 5s
      retries: 10

  # Local S3-compatible file storage, standing in for Cloudflare R2 during development.
  # RustFS (Apache-2.0) is used because MinIO no longer publishes container images.
  storage:
    image: rustfs/rustfs:1.0.4
    restart: unless-stopped
    environment:
      # Development-only credentials; they match S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY in .env.
      RUSTFS_ACCESS_KEY: crm-dev
      RUSTFS_SECRET_KEY: crm-dev-secret
      RUSTFS_OBS_LOG_DIRECTORY: ''
    ports:
      # Bound to localhost only. 9000 = S3 API (the browser uploads here), 9001 = web console.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - storagedata:/data
    healthcheck:
      test: ['CMD-SHELL', 'nc -z localhost 9000']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  storagedata:
